<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyShare - Login</title>

    <!-- Tipografia: Inter (Template Padrão) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Iconografia: Material Symbols (Google) -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

    <!-- Folha de estilo padrão -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-login">

    <main class="container-login">

        <!-- Logo OU Logo + Nome -->
        <div class="login-logo">
            <img src="img/logostudyshare.png" alt="Logo StudyShare - Início">
        </div>

        <!-- Mensagem de bem-vindo -->
        <p class="login-mensagem">Faça login para acessar os conteúdos</p>

        <!-- Cartão do formulário -->
        <section class="cartao-login">

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite o seu e-mail">
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite a sua senha">
            </div>

            <!-- Link clicável para redefinição de senha -->
            <div class="link-esqueceu">
                <a href="redefinir-senha.html">Esqueceu sua Senha?</a>
            </div>

            <!-- Botão para Login -->
            <button class="botao-primario botao-largo">
                Entrar
            </button>

            <!-- Link clicável para página de cadastro -->
            <p class="link-cadastro">
                Não tem uma conta? <a href="cadastro.html">Inscreva-se Aqui</a>
            </p>

        </section>

    </main>

</body>
</html>
